# Drop-in for systemd OLDER than 253 (check with `systemctl --version`), which
# does not know Type=notify-reload. Install it as
#
#   /etc/systemd/system/zfsbackup.service.d/pre-253.conf
#
# then `systemctl daemon-reload`. (The unit's own Type=notify-reload line makes
# those systemd versions log "Failed to parse service type, ignoring"; this file
# sets the type that works.) On systemd >= 253 do NOT install it: with an
# ExecReload= line `systemctl reload` would signal the daemon twice.
#
# This file must stay limited to the two settings below. In particular it does
# not touch RestartForceExitStatus=, which the unit sets.
[Service]
Type=notify
ExecReload=/bin/kill -HUP $MAINPID
