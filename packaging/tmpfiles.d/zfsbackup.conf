# Install to /usr/lib/tmpfiles.d/zfsbackup.conf (or /etc/tmpfiles.d/), then run
# `systemd-tmpfiles --create zfsbackup.conf`. Run `systemd-sysusers` first: the
# group must exist.
#
# The state directory is setgid (the leading 2) and group-writable: whichever of
# the daemon or an operator's CLI opens the database first creates its -wal/-shm
# sidecars, and setgid gives them the directory's group.
#
# `backups` is NOT group-writable: it is root's. Only the root ExecStartPre
# (`zfsbackup-config migrate --backup-dir`) writes pre-migration copies there,
# and a writable directory would let any group member delete or replace one.
# An operator running `zfsbackup-config backup` passes a DIR of their own.
#Type Path                     Mode  User Group     Age
d /var/lib/zfsbackup           2770  root zfsbackup -
d /var/lib/zfsbackup/backups   0700  root root      -
