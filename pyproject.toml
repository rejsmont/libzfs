[project]
name = "zfsbackup"
version = "1.0.0rc2"
description = "Automated ZFS snapshots, retention and remote backup over mutual TLS"
authors = [{name = "Radoslaw Kamil Ejsmont", email = "radoslaw@ejsmont.net"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
# The floors are what Debian 13 and Ubuntu 26.04 ship (the .deb depends on the
# distro's python3-* packages): do not raise one above those archives.
dependencies = [
    # Released in lockstep with this distribution; the version guard (S-8)
    # watches both installs. Keep it equal to libs/libzfseasy's version.
    "libzfseasy==1.0.0rc2",
    "pyyaml>=6.0,<7",
    "flask>=3.1.1,<4",
    # flask-sock 0.7.0 is vendored as zfsbackup/_vendor/flask_sock.py (in no
    # Debian/Ubuntu archive); it needs flask and simple-websocket only.
    # zfsbackup.workers._SessionSocket stands in for the socket simple-websocket
    # 1.1 uses (send/recv/close/fileno): re-check it before widening this.
    "simple-websocket>=1.1,<1.2",
    "websocket-client>=1.8.0,<2",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2",
    "click>=8.1,<9",
    "requests>=2.31,<3",
    # zfsbackup.workers._api_server_class subclasses werkzeug's development server and
    # zfsbackup.identity.pinned_session overrides urllib3 internals: re-check both
    # before widening these.
    "werkzeug>=3.1,<3.2",
    "urllib3>=2,<3",
    "cryptography>=43",
]

[project.scripts]
zfsbackup-config = "zfsbackup.cli.main:main"
zfsbackupd = "zfsbackup.daemon_entry:main"

[tool.poetry]
packages = [
    {include = "zfsbackup"},
]
# The systemd units and other install files live in `packaging/`. They ship in
# the sdist only: in a wheel the directory would install as a top-level
# `packaging` and shadow PyPA's. `packaging/` must never get an `__init__.py`
# or any .py file, for the same reason.
include = [
    {path = "packaging/**/*", format = "sdist"},
]

[tool.poetry.dependencies]
# Development only: the wheel's metadata comes from [project] above
# (`libzfseasy==<version>`); Poetry installs the sibling project editable.
libzfseasy = {path = "libs/libzfseasy", develop = true}

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
notebook = "^7.5.0"
pytest = "^9.0.2"
pytest-mock = "^3.12.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.5.0"
requests-mock = "^1.12.1"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
