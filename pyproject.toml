[tool.poetry]
name = "zfsbackup"
version = "0.1.0"
description = "Python interface to the ZFS utilities"
authors = ["Radoslaw Kamil Ejsmont <radoslaw@ejsmont.net>"]
license = "MIT"
readme = "README.md"
packages = [
    {include = "libzfseasy"},
    {include = "zfsbackup"},
]
# The systemd units and other install files live in `packaging/`. They ship in
# the sdist only: in a wheel the directory would install as a top-level
# `packaging` and shadow PyPA's. `packaging/` must never get an `__init__.py`
# or any .py file, for the same reason.
include = [
    {path = "packaging/**/*", format = "sdist"},
]

[tool.poetry.scripts]
zfsbackup-config = "zfsbackup.cli.main:main"
zfsbackupd = "zfsbackup.daemon_entry:main"

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"
# libzfs = {git = "https://gitlab.vibfolks.eu/rejsmont/py-libzfs.git"}
flask = "^3.1.3"
flask-sock = "^0.7.0"
# zfsbackup.workers._SessionSocket stands in for the socket simple-websocket
# 1.1 uses (send/recv/close/fileno): re-check it before widening this.
simple-websocket = ">=1.1,<1.2"
websocket-client = "^1.9.0"
sqlalchemy = ">=2.0,<2.2"
alembic = "^1.13"
click = "^8.1"
requests = ">=2.31,<3"
# zfsbackup.workers._api_server_class subclasses werkzeug's development server and
# zfsbackup.identity.pinned_session overrides urllib3 internals: re-check both
# before widening these.
werkzeug = ">=3.1,<3.2"
urllib3 = ">=2,<3"
cryptography = ">=43"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
notebook = "^7.5.0"
pytest = "^9.0.2"
pytest-mock = "^3.12.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.5.0"
requests-mock = "^1.12.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
