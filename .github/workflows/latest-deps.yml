name: latest-deps

# Weekly "latest allowed dependencies" run (plan C19 / S-9b, decisions C12 and Q12).
#
# poetry.lock pins what a normal CI run and a release install. This job throws
# the lock away and installs the NEWEST versions pyproject.toml allows
# (werkzeug >=3.1,<3.2, urllib3 >=2,<3, requests >=2.31,<3, sqlalchemy
# >=2.0,<2.2, and cryptography uncapped), then runs the mocked suite -- so an
# upstream release that breaks us shows up here, within a week, as a red run
# whose failing test names the internal that moved (tests/
# test_zfsbackup_platform_contracts.py), not as a surprise on somebody's next
# `pip install`. It never gates a pull request.
#
# The mocked suite needs no ZFS; the explicit zfs/zpool stubs below are the same
# as tests.yml's. The real-pool tier has its own workflow (real-zfs.yml).

on:
  schedule:
    # Mondays 04:41 UTC, off the hour so it does not queue with everything else.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: latest deps / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The scheduled run exists to be read: every cell reports, so one failure
    # does not hide whether the others are affected.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The floor and the two newest supported versions (3.14, 3.15).
        python: ["3.11", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python }}

      - name: Install poetry
        run: pipx install --python "${{ steps.py.outputs.python-path }}" poetry==2.1.1

      # `poetry update` re-resolves every constraint in pyproject.toml, ignoring
      # poetry.lock (the checkout's copy is rewritten and never committed).
      # Only the runtime dependencies are installed through poetry: the dev group
      # carries notebook tooling that has nothing to do with this check, and its
      # wheels lag behind new Pythons. The test tools come from pip, also newest.
      - name: Install the newest allowed dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry env use "${{ steps.py.outputs.python-path }}"
          poetry update --only main
          # `poetry update` does not install the root project (only `install`
          # builds it), so without this `libzfseasy`/`zfsbackup` are not
          # importable and collection fails in every cell. `--only-root` adds
          # the project and leaves the freshly updated dependencies alone.
          poetry install --only-root
          poetry run python -m pip install --upgrade pytest pytest-mock pytest-cov pytest-xdist requests-mock
          poetry run python -c "import sys; v='%d.%d' % sys.version_info[:2]; print(sys.version); assert v == '${{ matrix.python }}', v"

      - name: Show what changed against the lock
        # The part of this log that matters on a red run: the packages whose
        # version differs from poetry.lock.
        run: |
          git diff -U1 poetry.lock | grep -E '^[-+](name|version) = ' || echo "(no differences from poetry.lock)"
          poetry run python -m pip freeze | sort > "$RUNNER_TEMP/frozen.txt"
          cat "$RUNNER_TEMP/frozen.txt"

      - name: Provide stub zfs/zpool binaries
        run: |
          mkdir -p "$RUNNER_TEMP/zfsstub"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/zfsstub/zfs"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/zfsstub/zpool"
          chmod +x "$RUNNER_TEMP/zfsstub/zfs" "$RUNNER_TEMP/zfsstub/zpool"
          echo "ZFS_CMD=$RUNNER_TEMP/zfsstub/zfs" >> "$GITHUB_ENV"
          echo "ZPOOL_CMD=$RUNNER_TEMP/zfsstub/zpool" >> "$GITHUB_ENV"

      # The contract tests first, on their own: when an upgrade moved a
      # werkzeug / requests / urllib3 / simple-websocket internal, this step
      # fails in seconds and names it, ahead of the long suite below.
      - name: Platform contract tests
        run: >
          poetry run pytest --no-cov
          tests/test_zfsbackup_platform_contracts.py
          tests/test_zfsbackup_tls_platform.py

      - name: Run the mocked test suite
        run: poetry run pytest --no-cov

      - name: Upload the resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-deps-frozen-${{ runner.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/frozen.txt
          if-no-files-found: ignore
